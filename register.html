<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.5/css/dataTables.bootstrap5.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style/style.css">
    <title>Register</title>
</head>

<body>
    <div id="register">
        <nav class="navbar">
            <div class="logo">
                HewStore
            </div>

            <ul class="nav-links">
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="sales.html">Sales</a></li>
                <li><a href="products.html">Products</a></li>
            </ul>
        </nav>

        <!-- Hero -->
        <section class="hero">
            <h1>{{ title }}</h1>
            <p>{{ subtitle }}</p>
        </section>
        <div class="container">
            <h1>Register Page</h1>
            <form id="form" name="form" @submit.prevent="registerUser">
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" v-model="full_name"
                        aria-describedby="full_nameHelp" />
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" v-model="email" aria-describedby="emailHelp"
                        autocomplete="email" />
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" v-model="password"
                        aria-describedby="passwordHelp" autocomplete="current-password" />
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
                <i v-if="loader" class="fa-solid fa-spinner fa-spin"></i>
            </form>

            <div class="mt-3">
                <h2>List of Users</h2>
            </div>

            <table id="example" class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Date Registered</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- If this array is empty, DataTables will show "No data available" -->
                    <tr v-for="user in users" :key="user.id">
                        <td>{{ user.id }}</td>
                        <td>{{ user.full_name }}</td>
                        <td>{{ user.created_at }}</td>
                    </tr>
                </tbody>
            </table>




        </div>

        <!-- jQuery FIRST -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

        <!-- Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Axios -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.8/axios.js"></script>

        <!-- DataTables -->
        <script src="https://cdn.datatables.net/2.3.5/js/dataTables.js"></script>
        <script src="https://cdn.datatables.net/2.3.5/js/dataTables.bootstrap5.js"></script>

        <!-- Vue -->
        <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

        <!-- Your app LAST -->
        <script src="script/register.js"></script>
</body>

</html>
