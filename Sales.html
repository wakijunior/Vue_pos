<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Sales Page</title>
    <link rel="stylesheet" href="style/style.css" />
</head>

<body>
    <div id="sales">

        <!-- Hero -->
        <section class="hero">
            <h1>{{ title }}</h1>
            <p>{{ subtitle }}</p>
            <button class="btn">Shop Now</button>
        </section>

        <div class="btn-cart"><a href="cart.html" >
            Go to Cart ({{ cart.length }})
        </a></div>

        
        <!-- Products -->
        <div class="container">
            <h2 style="text-align: center">Our Products</h2>
            <div class="products">
                <div v-for="product in products" :key="product.name" class="product">
                    <img :src="product.image" :alt="product.name" />
                    <h3>{{ product.name }}</h3>
                    <p>{{ product.description }}</p>
                    <div class="price">Ksh. {{ product.price }}</div>
                    <button class="btn" @click="addToCart(product)">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- CTA -->
        <section class="cta">
            <h2>Limited Offer</h2>
            <p>Grab your favorite product before it's gone.</p>
            <button class="btn">Shop Now</button>
        </section>

        <footer>
            <p>&copy; 2026 Your Store</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.7.16/vue.min.js"
        integrity="sha512-Wx8niGbPNCD87mSuF0sBRytwW2+2ZFr7HwVDF8krCb3egstCc4oQfig+/cfg2OHd82KcUlOYxlSDAqdHqK5TCw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.8/axios.js"
        integrity="sha512-+dJa1RvuE8/HFftifMtr7hqixdEkb/DizfXUZAA0pyZeVdNnyZyKy9RnIWi0JSWUznbCNbaQNn0E6nbtrdL+9g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.js"
        integrity="sha512-OKuL2kpi8zfeXcqSXnGbL6tKc9JxWmppJY4mOSn1EsngRb7fx1N5+7wOTGqu2bI5OAYL3Og7/Beg7EsWG2OBKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.5/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.3.5/js/dataTables.bootstrap5.js"></script>
    <script src="script/sales.js"></script>
</body>

</html>
