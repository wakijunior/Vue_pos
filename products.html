<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.5/css/dataTables.bootstrap5.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style/style.css">
    <title>Products</title>
</head>

<body>
    <div id="products">
        <nav class="navbar">
            <div class="logo">
                HewStore
            </div>
            <ul class="nav-links">
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="sales.html">Sales</a></li>
                <li><a href="products.html">Products</a></li>
            </ul>
        </nav>

        <!-- Hero -->
        <section class="hero">
            <h1>{{ title }}</h1>
            <p>{{ subtitle }}</p>
        </section>

        <div class="container mt-4">


            <form @submit.prevent="createProduct">

                <h3>
                    {{ editingId ? 'Edit Product' : 'Add Product' }}
                </h3>

                <div class="row">

                    <div class="col-md-3 mb-3">
                        <input type="text" class="form-control" placeholder="Product Name" v-model="product_name">
                    </div>

                    <div class="col-md-2 mb-3">
                        <input type="number" class="form-control" placeholder="Quantity" v-model.number="quantity">
                    </div>

                    <div class="col-md-2 mb-3">
                        <input type="number" class="form-control" placeholder="Price" v-model.number="price">
                    </div>

                    <div class="col-md-3 mb-3">
                        <input type="file" class="form-control" @change="handleImageUpload" accept="image/*">
                    </div>

                    <div class="col-md-2 mb-3">
                        <button class="btn btn-success w-100" type="submit">
                            {{ editingId ? 'Update' : 'Add' }}
                        </button>
                    </div>

                </div>

            </form>
        </div>

        <!-- Products -->
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Image</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr v-for="product in products" :key="product.id">

                    <td>{{ product.id }}</td>
                    <td>{{ product.product_name }}</td>

                    <td>
                        <img :src="product.product_image" width="50">
                    </td>

                    <td>{{ product.quantity }}</td>
                    <td>Ksh {{ product.price }}</td>
                    <td>Ksh {{ product.total_price }}</td>

                    <td>
                        <button class="btn btn-primary btn-sm" @click="editProduct(product)">
                            Edit
                        </button>

                        <button class="btn btn-danger btn-sm" @click="deleteProduct(product.id)">
                            Delete
                        </button>
                    </td>

                </tr>
            </tbody>
        </table>

    </div>



    <!-- jQuery FIRST -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Axios -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.8/axios.js"></script>

    <!-- DataTables -->
    <script src="https://cdn.datatables.net/2.3.5/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.3.5/js/dataTables.bootstrap5.js"></script>

    <!-- Vue -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

    <script src="script/products.js"></script>

</body>

</html>
