        <script>
            Vue.createApp({
                data() {
                    return {
                        email: '',
                        password: '',
                        loader: false
                    }
                },
                methods: {
                    loginUser() {
                        this.loader = true;
                        axios.post('http://localhost:5000/login', {
                            email: this.email,
                            password: this.password
                        }).then((response) => {
                            console.log(response.data);

                            // ✅ SAVE TOKEN
                            localStorage.setItem("token", response.data.access_token);

                            this.loader = false;
                        }).catch((error) => {

                            alert(error.response?.data?.error || "Login failed");

                            this.loader = false;
                        });
                    }
                }
            }).mount('#login');
        </script>
